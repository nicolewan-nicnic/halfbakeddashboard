/* ============ batter calculator ============ */
function calcHTML(r){
  if(!r.calc || typeof r.calc!=='object' || Array.isArray(r.calc)) return '';
  if(r.calc.kind==='egg') return eggHTML(r);
  if(r.calc.kind==='anchor') return anchorHTML(r);
  const c=r.calc, per=c.dryPerCrepe||36;
  const dry=Math.round(c.dry*scale);
  const parts=calcCoco!==null?calcCoco:c.waterParts;
  const liquid=Math.round(dry*c.ratio);
  const cm=parts===0?liquid:Math.round(liquid/(1+parts)), wt=liquid-cm;
  const crepes=Math.max(1,Math.round(dry/per));
  const SPLITS=[['1:1',1],['1:2',2],['1:3',3],['1:5',5],['all coconut',0]];
  return `<div class="calc">
    <div class="calc-head"><span class="batch-label">Batter calculator</span>
      <span class="calc-rule">1 part dry : 2 parts liquid · about ${per} g per crêpe</span></div>
    <div class="calc-row">
      <span class="picker-label" style="margin:0;min-width:74px">Crêpes</span>
      <div class="calc-presets">${[2,4,7,10,14].map(v=>`<button class="ball" data-crepes="${v}" aria-pressed="${crepes===v}">${v}</button>`).join('')}</div>
    </div>
    <div class="calc-row">
      <label class="calc-in"><span class="picker-label">or set the dry mix</span>
        <div class="unitrow"><input id="c-dry" type="number" min="10" step="10" value="${dry}"><span class="calc-unit">g</span></div></label>
      <span class="calc-sync">the ingredients below follow this</span>
    </div>
    <div class="calc-row">
      <span class="picker-label" style="margin:0;min-width:74px">Coconut : water</span>
      <div class="calc-presets">${SPLITS.map(([lab,v])=>`<button class="ball" data-coco="${v}" aria-pressed="${parts===v}">${lab}</button>`).join('')}</div>
    </div>
    <div class="calc-out">
      <div class="co"><b>${cm.toLocaleString()}</b><span>ml coconut milk</span></div>
      <div class="co ${wt?'':'nil'}"><b>${wt.toLocaleString()}</b><span>ml sparkling water</span></div>
      <div class="co total"><b>${liquid.toLocaleString()}</b><span>ml liquid in total</span></div>
      <div class="co"><b>${crepes}</b><span>crêpe${crepes===1?'':'s'}</span></div>
    </div>
    <p class="hint" style="margin-top:8px">Thin as single cream, and better made with sparkling water. Stir it again before every ladle; the rice flour drops to the bottom within a minute.</p>
  </div>`;
}
function wireCalc(r){
  /* an empty array is truthy, so guard on shape rather than truthiness —
     a malformed calc block used to throw here and kill every later handler */
  if(!r.calc || typeof r.calc!=='object' || Array.isArray(r.calc)) return;
  if(r.calc.kind==='egg') return wireEgg(r);
  if(r.calc.kind==='anchor') return wireAnchor(r);
  const c=r.calc, per=c.dryPerCrepe||36;
  const d=$('#c-dry');
  if(d){
    d.oninput=()=>{ if(!d.value) return;
      const v=Math.min(5000,Math.max(10,Number(d.value)||10));
      scale=v/c.dry; refocus='c-dry'; render(); };
    d.onblur=()=>{ if(!d.value) render(); };
  }
  pane.querySelectorAll('[data-crepes]').forEach(b=>b.onclick=()=>{
    scale=(Math.round(Number(b.dataset.crepes)*per/5)*5)/c.dry; render(); });
  pane.querySelectorAll('[data-coco]').forEach(b=>b.onclick=()=>{ calcCoco=Number(b.dataset.coco); render(); });
}

/* ---- scale from one ingredient -------------------------------------------
   You rarely have exactly 1 kg of cream cheese. Type what you actually have
   and everything else follows, including the tin that keeps the same depth
   (diameter grows with the square root of the batch, so the bake time holds). */

/* ---- tin / container planner --------------------------------------------
   Batter is treated as ~1 g per ml, which is close enough for a cheesecake
   batter and keeps the maths legible. Area is what matters: pour the same
   grams per square centimetre and you get the same depth, so the bake
   behaves the same whatever you pour it into. */
function tinArea(t){
  if(t.shape==='round')  return Math.PI*Math.pow((t.d||0)/2,2);
  if(t.shape==='square') return Math.pow(t.d||0,2);
  return (t.l||0)*(t.w||0);
}
function tinName(t){
  if(t.shape==='round')  return 'Round '+(t.d||0)+' cm';
  if(t.shape==='square') return 'Square '+(t.d||0)+' cm';
  return 'Tray '+(t.l||0)+'×'+(t.w||0)+' cm';
}
function defaultTins(r){
  const d=(r.calc&&r.calc.tin)||20;
  return [{shape:'round',d,n:1}];
}
/* Split `total` grams across the containers.
   even : same depth everywhere — pour proportional to area
   first: fill the first container to the recipe depth, remainder to the rest */
function tinSplit(total,list,refDepth,mode){
  const rows=list.map(t=>({t,area:tinArea(t)*(t.n||1)})).filter(r=>r.area>0);
  if(!rows.length) return [];
  if(mode==='first'&&rows.length>1){
    const want=Math.min(total,rows[0].area*refDepth);
    const rest=Math.max(0,total-want);
    const restArea=rows.slice(1).reduce((a,r)=>a+r.area,0);
    return rows.map((r,i)=>{
      const g=i===0?want:(restArea?rest*(r.area/restArea):0);
      return {...r,g,depth:g/r.area};
    });
  }
  const area=rows.reduce((a,r)=>a+r.area,0);
  return rows.map(r=>({...r,g:total*(r.area/area),depth:total/area}));
}
function depthNote(depth,ref){
  if(depth<=0.05) return {cls:'idle',key:'idle',msg:'not needed — the first tin takes it all'};
  const p=depth/ref;
  if(p<0.3) return {cls:'note',key:'baseOnly',msg:'barely covers the base — bake it separately and check very early'};
  if(p<0.6) return {cls:'warn',key:'shallowWarn',msg:'much shallower than the recipe — it will bake far faster and can dry out'};
  if(p<0.85)return {cls:'note',key:'shallow',msg:'shallower than the recipe — start checking early'};
  if(p<=1.15)return {cls:'ok',key:'ok',msg:'about the depth the recipe is built for'};
  if(p<=1.4) return {cls:'note',key:'deep',msg:'deeper than the recipe — give it longer and drop the heat if it colours fast'};
  return {cls:'warn',key:'deepWarn',msg:'much deeper than the recipe — the middle may not set'};
}

/* Japanese overlay for the anchor calculator + tin planner. Only kicks in for a
   recipe that carries an i18n[lang].calc block (currently just pistachio-basque);
   otherwise every `L(...)` falls back to the English string. */
function calcLang(r){ return (recipeLang!=='en' && r && r.i18n && r.i18n[recipeLang] && r.i18n[recipeLang].calc) || null; }

function tinPlannerHTML(r,total){
  const c=r.calc, CL=calcLang(r);
  const L=(k,en)=> (CL && CL[k]!=null) ? CL[k] : en;
  const refDepth=(c.base?( (c.sharedG-40-300+ (c.options[0].cornstarch||40) + (c.options[0].cream||300)
      + c.options[0].items.reduce((a,[,g])=>a+g,0)) / (Math.PI*Math.pow(c.tin/2,2)) ):5);
  if(!tins) tins=defaultTins(r);
  const rows=tinSplit(total,tins,refDepth,tinMode);
  const poured=rows.reduce((a,x)=>a+x.g,0);
  const over=total-poured;
  return `<div class="tinplan">
    <div class="calc-head"><span class="batch-label">${L('tinsTitle','Tins and containers')}</span>
      <span class="calc-rule">${CL?L('builtFor','').replace('{d}',refDepth.toFixed(1)):`this recipe is built for a ${refDepth.toFixed(1)} cm depth`}</span></div>
    <div class="calc-row" style="margin-bottom:6px">
      <div class="calc-presets">
        <button class="ball" data-tmode="even" aria-pressed="${tinMode==='even'}">${L('tmodeEven','Same depth in each')}</button>
        <button class="ball" data-tmode="first" aria-pressed="${tinMode==='first'}">${L('tmodeFirst','Fill the first, rest over')}</button>
      </div>
    </div>
    <ul class="tinlist">${tins.map((t,i)=>{
      const row=rows.find(x=>x.t===t);
      const note=row&&row.area?depthNote(row.depth,refDepth):null;
      return `<li class="tinrow">
        <div class="tinrow-in">
          <select data-tshape="${i}">
            <option value="round"  ${t.shape==='round'?'selected':''}>${L('round','Round')}</option>
            <option value="square" ${t.shape==='square'?'selected':''}>${L('square','Square')}</option>
            <option value="tray"   ${t.shape==='tray'?'selected':''}>${L('tray','Tray')}</option>
          </select>
          ${t.shape==='tray'
            ? `<input type="number" min="1" step="0.5" value="${t.l||20}" data-tl="${i}" aria-label="Length cm"><span class="calc-unit">×</span>
               <input type="number" min="1" step="0.5" value="${t.w||10}" data-tw="${i}" aria-label="Width cm"><span class="calc-unit">cm</span>`
            : `<input type="number" min="1" step="0.5" value="${t.d||20}" data-td="${i}" aria-label="Size cm"><span class="calc-unit">cm</span>`}
          <span class="calc-unit">×</span><input type="number" min="1" step="1" value="${t.n||1}" data-tn="${i}" aria-label="How many" style="width:52px">
          ${tins.length>1?`<button class="link-btn" data-trm="${i}">${L('remove','remove')}</button>`:''}
        </div>
        ${row&&row.area?`<div class="tinrow-out ${note.cls}">
          <b>${Math.round(row.g/(t.n||1)).toLocaleString()}</b> g ${(t.n||1)>1?L('inEach','in each'):L('inOne','in')} · <b>${row.depth.toFixed(1)}</b> ${L('deep','cm deep')}
          <span class="tinnote">${CL?(CL.notes&&CL.notes[note.key]||note.msg):note.msg}</span></div>`:''}
      </li>`;}).join('')}</ul>
    <div class="tinfoot">
      <button class="link-btn" id="tin-add">${L('addContainer','+ Add a container')}</button>
      ${Math.abs(over)>1?`<span class="tinover">${over>0?(CL?L('leftOver','').replace('{g}',Math.round(over).toLocaleString()):Math.round(over).toLocaleString()+' g left over'):''}</span>`:''}
    </div>
  </div>`;
}
function anchorHTML(r){
  const c=r.calc, CL=calcLang(r);
  const L=(k,en)=> (CL && CL[k]!=null) ? CL[k] : en;
  const iname=n=>(CL && CL.ing && CL.ing[n.toLowerCase()]) || n.toLowerCase();
  const have=Math.round(c.base*scale);
  const opt=c.options.find(o=>o.k===(anchorOpt||c.options[0].k))||c.options[0];
  const optW=opt.items.reduce((a,[,g])=>a+g,0);
  const cf=opt.cornstarch||40, cr=opt.cream||300;
  const total=Math.round((c.sharedG-40-300+cf+cr+optW)*scale);
  const tin=c.tin*Math.sqrt(scale);
  const eggG=Math.round(c.eggG*scale), eggN=eggG/50;
  const eggAboutN=eggN%1<0.15||eggN%1>0.85?Math.round(eggN):Math.floor(eggN)+'–'+Math.ceil(eggN);
  const jaTop=(recipeLang!=='en' && r.i18n && r.i18n[recipeLang]) || null;
  const optLbl=o=>(jaTop && jaTop.calcLabels && jaTop.calcLabels[o.k]) || o.label;
  return `<div class="calc">
    <div class="calc-head"><span class="batch-label">${CL?L('scaleBy','') :'Scale by '+esc(c.name.toLowerCase())}</span>
      <span class="calc-rule">${L('follows','everything below follows what you actually have')}</span></div>
    <div class="calc-row">
      <label class="calc-in"><span class="picker-label">${CL?L('inTub',''):esc(c.name)+' in the tub'}</span>
        <div class="unitrow"><input id="a-have" type="number" min="50" step="50" value="${have}"><span class="calc-unit">g</span></div></label>
      <div class="calc-presets">${[500,750,1000,1200,1500].map(v=>`
        <button class="ball" data-anchor="${v}" aria-pressed="${have===v}">${v>=1000?(v/1000)+'kg':v+'g'}</button>`).join('')}</div>
    </div>
    <div class="calc-row">
      <span class="picker-label" style="margin:0;min-width:84px">${L('madeWith','Made with')}</span>
      <div class="calc-presets">${c.options.map(o=>`
        <button class="ball" data-aopt="${o.k}" aria-pressed="${o.k===opt.k}">${esc(optLbl(o))}</button>`).join('')}</div>
    </div>
    <div class="calc-out">
      <div class="co total"><b>${tin.toFixed(0)}</b><span>${L('tinKeepDepth','cm tin, to keep the depth')}</span></div>
      <div class="co"><b>${eggG}</b><span>${CL?L('eggAbout','').replace('{n}',eggAboutN):`g egg · about ${eggAboutN} large`}</span></div>
      ${opt.items.map(([n,g])=>`<div class="co"><b>${Math.round(g*scale)}</b><span>g ${esc(iname(n))}</span></div>`).join('')}
      <div class="co"><b>${Math.round(cr*scale)}</b><span>${L('doubleCream','g double cream')}</span></div>
      <div class="co"><b>${Math.round(cf*scale)}</b><span>${L('cornflour','g cornflour')}</span></div>
      <div class="co"><b>${(total/1000).toFixed(2)}</b><span>${L('batter','kg of batter')}</span></div>
    </div>
    ${tinPlannerHTML(r,total)}
    <p class="hint" style="margin-top:8px">${CL?L('hint','').replace('{g}',c.eggG):`Weigh the eggs rather than counting them — six large is about ${c.eggG} g out of the shell, and shell weights vary more than you would think. Bake time stays about the same as long as the depth does.`}</p>
  </div>`;
}
function wireAnchor(r){
  const c=r.calc;
  const set=g=>{ scale=Math.max(0.05,g/c.base); render(); };
  pane.querySelectorAll('[data-anchor]').forEach(b=>b.onclick=()=>set(Number(b.dataset.anchor)));
  pane.querySelectorAll('[data-aopt]').forEach(b=>b.onclick=()=>{
    anchorOpt=b.dataset.aopt;
    ticked.ing.clear();        /* the visible opt rows change, so old ticks no longer line up */
    render();
  });
  const el=$('#a-have');
  if(el){ el.oninput=()=>{ if(!el.value) return; const v=Number(el.value);
    if(v>0){ scale=v/c.base; refocus='a-have'; render(); } };
    el.onblur=()=>{ if(!el.value) render(); }; }

  /* --- tin planner --- */
  if(!tins) tins=defaultTins(r);
  pane.querySelectorAll('[data-tmode]').forEach(b=>b.onclick=()=>{ tinMode=b.dataset.tmode; render(); });
  const add=$('#tin-add');
  if(add) add.onclick=()=>{ tins=[...tins,{shape:'round',d:12,n:1}]; render(); };
  pane.querySelectorAll('[data-trm]').forEach(b=>b.onclick=()=>{
    tins=tins.filter((_,i)=>i!==Number(b.dataset.trm)); render(); });
  pane.querySelectorAll('[data-tshape]').forEach(s=>s.onchange=()=>{
    const i=Number(s.dataset.tshape); const t={...tins[i],shape:s.value};
    if(s.value==='tray'){ t.l=t.l||20; t.w=t.w||10; } else { t.d=t.d||20; }
    tins=tins.map((x,j)=>j===i?t:x); render(); });
  const num=(sel,key)=>pane.querySelectorAll(sel).forEach(inp=>{
    inp.oninput=()=>{ const i=Number(inp.dataset[key.attr]); const v=Number(inp.value);
      if(!(v>0)) return;
      tins=tins.map((x,j)=>j===i?{...x,[key.field]:v}:x);
      refocus=null; render();
      const again=pane.querySelector(sel.replace(']','="'+i+'"]'));
      if(again){ again.focus(); again.setSelectionRange(again.value.length,again.value.length); } };
  });
  num('[data-td]',{attr:'td',field:'d'});
  num('[data-tl]',{attr:'tl',field:'l'});
  num('[data-tw]',{attr:'tw',field:'w'});
  num('[data-tn]',{attr:'tn',field:'n'});
}

/* ---- egg timer ------------------------------------------------------------
   Centre temperature follows T = Tair + (Tstart - Tair)·A·e^(-t/tau).
   tau and A were fitted to two well-attested air-fryer results (12 min at
   120C and 11 min at 132C, both from the fridge). The same fit then predicts
   33 min at 70C and 38 min at 68C — inside the published 30-45 min window for
   onsen eggs, which is a decent sign the curve is honest.                  */
const EGG_TAU=671, EGG_A=1.401;
function eggMinutes(air,start,target,grams){
  const th=(target-air)/(start-air);
  if(!(th>0)||th>=EGG_A) return null;                 /* air too cool to ever get there */
  const size=Math.pow((grams||57)/57, 2/3);           /* time scales with radius squared */
  return -EGG_TAU*size*Math.log(th/EGG_A)/60;
}
function eggHTML(r){
  const air=eggAir!==null?eggAir:(r.calc.air||70);
  const mins=eggMinutes(air,eggStart,eggTarget,eggSize);
  const TARGETS=[[63,'barely set'],[65,'classic onsen'],[68,'firmer yolk']];
  const SIZES=[[50,'medium'],[57,'large'],[64,'x-large'],[71,'jumbo']];
  return `<div class="calc">
    <div class="calc-head"><span class="batch-label">Egg timer</span>
      <span class="calc-rule">works out when the yolk centre reaches your target</span></div>
    <div class="calc-row">
      <span class="picker-label" style="margin:0;min-width:92px">Straight from</span>
      <div class="calc-presets">
        <button class="ball" data-estart="4" aria-pressed="${eggStart===4}">the fridge · 4°C</button>
        <button class="ball" data-estart="20" aria-pressed="${eggStart!==4}">room temperature</button>
        ${eggStart!==4?`<span class="unitrow"><input id="e-start" type="number" min="5" max="35" step="1" value="${eggStart}"><span class="calc-unit">°C</span></span>`:''}
      </div>
    </div>
    <div class="calc-row">
      <label class="calc-in"><span class="picker-label">Air fryer set to</span>
        <div class="unitrow"><input id="e-air" type="number" min="50" max="200" step="5" value="${air}"><span class="calc-unit">°C</span></div></label>
      <div class="calc-presets">${[70,75,80,120].map(v=>`<button class="ball" data-eair="${v}" aria-pressed="${air===v}">${v}°</button>`).join('')}</div>
    </div>
    <div class="calc-row">
      <span class="picker-label" style="margin:0;min-width:92px">Yolk centre</span>
      <div class="calc-presets">${TARGETS.map(([v,lab])=>`
        <button class="ball" data-etarget="${v}" aria-pressed="${eggTarget===v}">${v}°C <span class="n">${lab}</span></button>`).join('')}</div>
    </div>
    <div class="calc-row">
      <span class="picker-label" style="margin:0;min-width:92px">Egg size</span>
      <div class="calc-presets">${SIZES.map(([g,lab])=>`
        <button class="ball" data-esize="${g}" aria-pressed="${eggSize===g}">${lab}</button>`).join('')}</div>
    </div>
    <div class="calc-out">
      ${mins?`<div class="co total"><b>${mins<60?Math.round(mins)+' min':Math.floor(mins/60)+'h '+Math.round(mins%60)+'m'}</b><span>in the air fryer</span></div>
        <div class="co"><b>${eggTarget}</b><span>°C in the middle</span></div>
        <div class="co"><b>${air}</b><span>°C air, and the egg can never pass it</span></div>`
      :`<div class="co" style="grid-column:1/-1"><b>—</b><span>${air<=eggTarget?`The air is at ${air}°C, so the egg can never reach ${eggTarget}°C. Set the fryer higher than your target.`:'Out of range for this model.'}</span></div>`}
    </div>
    <p class="hint" style="margin-top:8px">Below about 80°C the white never fully sets, which is the whole point — silky white, custardy yolk. Above 100°C the outside races ahead of the middle and you get a normal jammy egg instead. Ice bath the moment they come out.</p>
  </div>`;
}
function wireEgg(r){
  const re=()=>{ const el=pane.querySelector('.calc'); if(!el) return;
    const keep=document.activeElement&&document.activeElement.id;
    el.outerHTML=eggHTML(r); wireEgg(r); shapeBalls();

  pane.querySelectorAll('[data-estart]').forEach(b=>b.onclick=()=>{ eggStart=Number(b.dataset.estart); re(); });

/* ---- the table layout ----------------------------------------------------
   Ingredients down the left; each stage brackets everything folded in so far,
   so you read the shape of the recipe instead of counting steps. Works by
   matching ingredient names against the method text, which is a guess — so
   anything it cannot place is grouped at the end rather than hidden.       */
/* Words that never head an instruction on their own — articles, prepositions,
   subordinators, pronouns, quantifiers, and the handful of adverbs recipes
   open with ("Gently heat…", "Once set, whisk…"). stageLabel steps over all
   of them looking for the actual verb, rather than stopping at the first
   word — a sentence starting "The day before, gently heat…" or "If it looks
   grainy…" has no verb in its first two or three words at all. */
const STAGE_STOP=new Set(['the','a','an','in','into','to','of','on','at','over','under','with','without','from','for','by','through','onto','off','out','up','down','back',
  'if','when','while','after','before','once','unless','until','and','but','then','now','next','finally','meanwhile','here','there','so','as',
  'it','them','this','that','its','your','you','all','each','every','some','any','no','one','two','three',
  'gently','quickly','carefully','immediately','slowly','lightly','briefly','thoroughly','evenly','still','just','also','together','fully','completely']);
function stageLabel(step){
  let text=String(step).trim();
  /* A leading clause before an early comma ("The day before,", "Once fully
     set,") almost never carries the verb — drop it and read on from there. */
  const comma=text.indexOf(',');
  if(comma>0&&comma<40){
    const lead=text.slice(0,comma).trim().split(/\s+/)[0].replace(/[^A-Za-z]/g,'').toLowerCase();
    if(STAGE_STOP.has(lead)) text=text.slice(comma+1);
  }
  const w=text.trim().split(/[\s,]+/).map(x=>x.replace(/[^A-Za-z]/g,'')).filter(Boolean);
  const v=w.find(x=>x&&!STAGE_STOP.has(x.toLowerCase()))||w[0]||'';
  return v.toLowerCase();
}
function buildGrid(r,opt){
  /* build-your-own meals and ice creams (combine · cook · chill · churn) have
     no real ingredient-by-stage structure — the word-match table just misleads */
  if((r.tags||[]).includes('Assembly')||(r.tags||[]).includes('Ice cream')) return null;
  /* `opt` restricts this one table to a single either/or version — its own
     ingredients plus whatever's shared, matched only against that version's
     own method steps. A recipe with no opt groups at all is called with
     opt===undefined, which the !i.opt/!optOf(s) checks let straight through. */
  const ings=(r.ingredients||[]).filter(i=>i.name&&!isSection(i.name)&&(!i.opt||i.opt===opt));
  /* Keep each step's absolute index (its position in r.method, same one an
     ingredient's `step` refers to) alongside its filtered position, so an
     explicitly-tagged ingredient can be placed exactly rather than guessed. */
  const stepsFiltered=(r.method||[]).map((s,idx)=>({idx,text:methodText(s),opt:optOf(s)})).filter(s=>!s.opt||s.opt===opt);
  const steps=stepsFiltered.map(s=>s.text);
  if(!ings.length||steps.length<2) return null;
  const absToLocal=new Map(stepsFiltered.map((s,li)=>[s.idx,li]));
  const head=n=>norm(String(n).split(',')[0]).split(' ').filter(w=>w.length>2);
  const at=ings.map(i=>{
    if(i.step!=null && absToLocal.has(i.step)) return absToLocal.get(i.step);
    const words=head(i.name);
    for(let s=0;s<steps.length;s++){
      const t=norm(steps[s]);
      if(words.length&&words.some(w=>t.includes(w))) return s;
    }
    return -1;                                   /* never named in the method */
  });
  const placed=at.filter(x=>x>=0).length;
  if(placed<Math.ceil(ings.length*0.45)) return null;   /* too vague to draw honestly */
  const rows=ings.map((i,n)=>({ing:i,step:at[n],absStep:at[n]>=0?stepsFiltered[at[n]].idx:null}))
    .sort((a,b)=>(a.step<0?99:a.step)-(b.step<0?99:b.step));
  const used=[...new Set(rows.map(r2=>r2.step).filter(s=>s>=0))].sort((a,b)=>a-b);
  const cols=used.map(s=>({label:stageLabel(steps[s]),absStep:stepsFiltered[s].idx,
    span:rows.filter(r2=>r2.step>=0&&r2.step<=s).length}));
  const tail=steps.length-1;
  if(!cols.length||cols[cols.length-1].span<rows.filter(r2=>r2.step>=0).length) return null;
  cols.push({label:stageLabel(steps[tail]),absStep:stepsFiltered[tail].idx,span:rows.length,final:true});
  /* Colour only the stages an ingredient was explicitly tagged into —
     word-matched guesses (every recipe without `step` tags) stay
     uncoloured, exactly as the table looked before this existed. */
  const taggedAbsSteps=new Set(ings.filter(i=>i.step!=null).map(i=>i.step));
  const stepColors=stepColorMap(cols.map(c=>taggedAbsSteps.has(c.absStep)?c.absStep:null));
  return {rows,cols,unplaced:rows.filter(r2=>r2.step<0).length,stepColors};
}
function gridHTML(r,grids,optLabel,curOpt){
  const jaIng=(recipeLang!=='en' && r.i18n && r.i18n[recipeLang] && r.i18n[recipeLang].ingredients)||null;
  const nm=ing=>{ if(!jaIng) return ing.name; const i=r.ingredients.indexOf(ing); return i>=0&&jaIng[i]!=null?jaIng[i]:ing.name; };
  if(!grids||!grids.length) return `<p class="empty">${jaIng?'このレシピは工程がきれいに分かれないため、ステップ表示のほうが分かりやすいです。':'This one does not fall into neat stages — the steps view is clearer for it.'}</p>`;
  /* One table per either/or version, same as the ingredients list — pick
     whichever the "Made with" buttons last selected (shared with the
     steps view via curOpt) rather than printing all of them at once. */
  const chosen=grids.find(g=>g.key===curOpt)||grids[0];
  const one=g=>`<table class="rgrid">
    ${g.rows.map((row,n)=>{
      const rc=g.stepColors.get(row.absStep);
      return `<tr>
      <td class="gi"${rc?` style="border-left:5px solid ${rc}"`:''}><span class="qty">${row.ing.qty!=null?esc(fmt(row.ing.qty*scale))+'<span class="unit">'+esc(row.ing.unit||'')+'</span>':'—'}</span>
        <span class="gname">${esc(nm(row.ing))}</span></td>
      ${g.cols.map(c=>{
        const cc=!c.final&&g.stepColors.get(c.absStep);
        if(n===0) return `<td class="gs ${c.final?'final':''}"${cc?` style="background:${cc};color:var(--ivory)"`:''} rowspan="${c.span}">${esc(c.label)}</td>`;
        if(n>=c.span) return '<td class="gs pad"></td>';   /* bracket closed above — keep the column aligned */
        return '';                                          /* still under the row-0 rowspan */
      }).join('')}
    </tr>`;}).join('')}
  </table>
  ${g.unplaced?`<p class="hint">${jaIng?`作り方で個別に触れていない材料が${g.unplaced}件 — 下にまとめています。`:`${g.unplaced} item${g.unplaced===1?'':'s'} the method never names by hand — listed at the bottom.`}</p>`:''}`;
  return `<div class="gridwrap">
    ${grids.length>1?`<div class="ing-opt">
      <span class="ing-opt-label">Made with</span>
      <div class="ing-opt-picks">${grids.map(({key})=>`
        <button class="ball" data-iopt="${esc(key)}" aria-pressed="${key===chosen.key}">${esc(optLabel(key))}</button>`).join('')}</div>
    </div>`:''}
    ${one(chosen.grid)}</div>`;
}

/* `opt` (which either/or version a row belongs to) and `step` (the method step
   that uses it) have no field in this form, but they must survive a save —
   without this, opening any tagged recipe and pressing Save wrote an override
   that silently stripped its colour grouping and usage order for good. They
   ride on the row element itself, so they also survive adding, removing and
   reordering rows; a row added by hand simply has neither. */
function rowHtml(i){
  return `<div class="edit-row"${i.opt!=null?` data-opt="${esc(i.opt)}"`:''}${i.step!=null?` data-step="${i.step}"`:''}>
    <input class="num qty-input" type="number" step="any" value="${i.qty??''}" placeholder="Amt" aria-label="Amount">
    <input class="unit-input" value="${esc(i.unit||'')}" placeholder="Unit" aria-label="Unit">
    <input class="ing-input" value="${esc(i.name||'')}" placeholder="Ingredient" aria-label="Ingredient">
    <button class="row-x" aria-label="Remove ingredient">×</button></div>`;
}
function bindRows(){ $('#rows').querySelectorAll('.row-x').forEach(b=>b.onclick=()=>b.closest('.edit-row').remove()); }
function collect(){
  const rows=[...$('#rows').querySelectorAll('.edit-row')].map(row=>{
    const q=row.querySelector('.qty-input').value.trim();
    const ing={qty:q===''?null:Number(q),unit:row.querySelector('.unit-input').value.trim(),name:row.querySelector('.ing-input').value.trim()};
    if(row.dataset.opt!=null) ing.opt=row.dataset.opt;                 /* see rowHtml — neither has a field */
    if(row.dataset.step!=null) ing.step=Number(row.dataset.step);      /* in the form, so they ride the row */
    return ing;
  }).filter(i=>i.name);
  return {name:$('#f-name').value.trim()||'Untitled recipe',
    blurb:$('#f-blurb').value.trim(), icon:draft.icon||'croissant', img:draft.img||null,
    cuisine:($('#f-cuisine')?$('#f-cuisine').value.trim():'')||null,
    tags:($('#f-tags')?$('#f-tags').value.split(',').map(t=>t.trim()).filter(Boolean):[]),
    kcal:$('#f-kcal').value===''?null:Number($('#f-kcal').value), calc:draft.calc||null,
    prep:$('#f-prep').value.trim(),
    link:($('#f-link')?$('#f-link').value.trim():'')||null,
    makesQty:$('#f-makes').value===''?null:Number($('#f-makes').value),
    makesUnit:$('#f-unit').value.trim(), ingredients:rows,
    /* The textarea is plain lines, so a step's `opt` (which version it belongs
       to) would be lost on save. Carry it back by matching the line against the
       text it was rendered from — an edited line drops its tag, which is the
       honest outcome, but an untouched one keeps it. Each original is claimed
       at most once: two versions of a recipe can share word-for-word identical
       steps (the milk pudding heats plain and coffee the same way), and
       matching the first one every time would retag the second. */
    method:(()=>{
      const claimed=new Set();
      return $('#f-method').value.split('\n').map(s=>s.trim()).filter(Boolean).map(line=>{
        const n=(draft.method||[]).findIndex((m,idx)=>!claimed.has(idx)&&m&&typeof m==='object'&&m.opt&&m.text===line);
        if(n<0) return line;
        claimed.add(n);
        return {text:line,opt:draft.method[n].opt};
      });
    })()};
}
async function onSave(){
  /* Every other form here refuses an empty name and puts the cursor back in the
     field. This one quietly saved "Untitled recipe" with no ingredients and no
     method, then closed the editor — easy to do by tapping Save on a blank form,
     and the result is hard to find again precisely because it has no name. */
  const nameEl=$('#f-name');
  if(nameEl && !nameEl.value.trim()){
    nameEl.focus();
    if(nameEl.scrollIntoView) nameEl.scrollIntoView({block:'center',behavior:'smooth'});
    toast('Give the recipe a name first');
    return;
  }
  const data=collect();
  if(draft._isNew){
    const rec=Object.assign({id:uid(data.name)},data);
    mine.unshift(rec); currentId=rec.id;
  }else{
    const cur=find(currentId);
    if(cur&&cur._seeded){
      const d=diffFromSeed(currentId,data);
      if(d) overrides[currentId]=d; else delete overrides[currentId];   /* back to shipped = no override */
    }else{
      const i=mine.findIndex(r=>r.id===currentId);
      if(i>=0) mine[i]=Object.assign({id:currentId},data);
    }
  }
  rebuild();
  editing=false; draft=null; ticked.ing.clear(); ticked.step.clear();
  const ok=await saveRecipeStores(); render(); if(ok) toast('Saved');
}

/* ============ fridge intake (shared by form, put-away, photo) ============ */
function addToFridge({name,qty,shelf,until,staple}){
  /* Merge only with the *same* item (plurals allowed) — not any stored name that
     merely contains this one, which used to fold "red onion" into "onion" and
     "chicken stock" into "chicken". */
  fridgeCacheClear();                      /* the fridge is about to change under the cache */
  const nk=sing(norm(name));
  const existing=nk.length>=3?fridge.find(f=>sing(norm(f.name))===nk):null;
  if(existing){
    if(qty) existing.qty=qty;
    existing.shelf=shelf||existing.shelf;
    existing.until=until!==undefined?until:existing.until;
    existing.addedAt=todayISO();
    if(staple!==undefined) existing.staple=staple;
    return {item:existing,merged:true};
  }
  const item={id:'f'+Date.now()+Math.random().toString(36).slice(2,6),
    name,qty:qty||'',shelf:shelf||'Fridge',until:until||'',staple:!!staple,addedAt:todayISO()};
  fridge.push(item);
  return {item,merged:false};
}
function learnDate(name,shelf,pickedISO){
  const sug=sugDate(name,shelf);
  if(!pickedISO||pickedISO===sug) return;
  const days=dayDiff(pickedISO); if(days==null||days<0) return;
  const b=norm(String(name).split(',')[0]); if(!b) return;
  foodPrefs[b]=foodPrefs[b]||{}; foodPrefs[b][shelf]=days;
  savePrefs();
}

function wirePhotoReview(){
  if(!photoReview) return;
  pane.querySelectorAll('[data-rev-on]').forEach(el=>el.onchange=()=>{photoReview[+el.dataset.revOn].on=el.checked;});
  pane.querySelectorAll('[data-rev-name]').forEach(el=>el.oninput=()=>{photoReview[+el.dataset.revName].name=el.value;});
  pane.querySelectorAll('[data-rev-qty]').forEach(el=>el.oninput=()=>{photoReview[+el.dataset.revQty].qty=el.value;});

  const go=$('#rev-go'); if(go) go.onclick=async()=>{

    photoReview.filter(p=>p.on&&p.name.trim()).forEach(p=>{
      const res=addToFridge({name:p.name.trim(),qty:p.qty.trim(),shelf:p.shelf,until:sugDate(p.name,p.shelf)});
      res.merged?merged++:added++;
    });

  const cx=$('#rev-cancel'); if(cx) cx.onclick=()=>{ photoReview=null; render(); };

async function handlePhoto(file){
  photoBusy=true; render();
  try{
    const b64=await new Promise((res,rej)=>{
      const r=new FileReader();
      r.onload=()=>res(r.result.split(',')[1]);
      r.onerror=()=>rej(new Error('read'));
      r.readAsDataURL(file);
    });
    const resp=await fetch(AI_ENDPOINT,{
      method:'POST',headers:apiHeaders({'Content-Type':'application/json'}),
      body:JSON.stringify({model:AI_MODEL,max_tokens:1000,
        messages:[{role:'user',content:[
          {type:'image',source:{type:'base64',media_type:file.type||'image/jpeg',data:b64}},
          {type:'text',text:'This is a photo of groceries: a shop receipt, or food items, or a fridge shelf. List the food and drink items only (skip bags, totals, discounts, non-food). Respond with ONLY a JSON array, no markdown, no preamble: [{"name":"specific item name e.g. jasmine rice not rice","qty":"short amount like 2 or 400g or empty string","shelf":"Fridge"|"Freezer"|"Cupboard"}]. shelf = where it is normally stored.'}
        ]}]})});
    if(!resp.ok) throw new Error('http '+resp.status);
    const data=await resp.json();
    const txt=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
    const clean=txt.replace(/```json|```/g,'').trim();
    const items=JSON.parse(clean);
    if(!Array.isArray(items)||!items.length) throw new Error('none');
    photoReview=items.slice(0,25).map(p=>({name:String(p.name||''),qty:String(p.qty||''),
      shelf:SHELVES.includes(p.shelf)?p.shelf:shelfFor(p.name||''),on:true}));
  }catch(e){
    const m=String(e&&e.message||e);
    banner(/http 413/.test(m) ? 'That photo is too large to send — try a smaller shot.'
      : /http 401/.test(m) ? 'Photo intake needs the owner key — open the app from your ?k=… link first.'
      : /http 501/.test(m) ? 'Photo intake is not set up on this deployment (no AI key).'
      : /http 5\d\d|http 4\d\d/.test(m) ? 'The photo service had a problem — try again in a moment.'
      : 'Could not read anything from that photo. A clearer shot of the receipt or items usually does it.');
  }
  photoBusy=false; render();
}

/* ============ meal plan ============ */
/* the planner never *suggests* a dessert or an ice cream — you can still plan one
   by searching for it by name, but it won't turn up in an unprompted list */
function plannerSuggest(r){ return !(r.tags||[]).some(t=>t==='Dessert'||t==='Ice cream'); }
function renderPlan(){
  const t=new Date(); t.setHours(0,0,0,0);

  for(let i=0;i<14;i++){ const d=new Date(t); d.setDate(t.getDate()+i); days.push(isoLocal(d)); }
  const urgent=urgentItems();

  pane.innerHTML=`<article class="card">
    <div class="card-head">

    <div class="plan-grid">${days.map(iso=>{
      const d=new Date(iso+'T00:00:00');
      const label=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()]+' '+d.getDate();
      const meals=(plan[iso]||[]).map((p,idx)=>{
        /* every row's left marker is a drag handle — reorder within a day or move
           to another day. On a written line it doubles as the done toggle: a
           plain tap ticks it off (a drag still moves it). */
        const isNote=p.note!=null && p.id==null;
        const head=isNote
          ? `<span class="drag-grip${p.done?' on':''}" data-note-done="${iso}|${idx}" role="button" tabindex="0" aria-pressed="${!!p.done}" aria-label="Tick off, or drag to move">⠿</span>`
          : `<span class="drag-grip" aria-label="Drag to move">⠿</span>`;
        const rowX=`<button class="row-x" style="font-size:14px" data-unplan="${iso}|${idx}" aria-label="Remove">×</button>`;
        const wrap=(cls,inner)=>`<div class="plan-meal ${cls}" data-iso="${iso}" data-pidx="${idx}">${head}${inner}</div>`;
        if(p.tmpl==='nbd'){
          const miss=nbdMissing(p).length;
          return wrap(`${p.status==='completed'||p.done?'done':''} ${p.status==='skipped'?'skipped':''}`,
            `<button class="pm-name" data-nbd="${iso}|${idx}">No-Brainer Dinner</button>
             <span class="pm-foot">${rowX}<span class="pm-sub">${esc(nbdSummary(p))}${miss?` <span class="chip soon">${miss} to sort</span>`:''}</span></span>`);
        }

async function togglePlanDone(iso,idx){
  const p=plan[iso]&&plan[iso][+idx]; if(!p) return;
  p.done=!p.done; await savePlan(); render();
}

/* Drag a plan row by its grip to reorder it within a day or drop it on another
   day. Pointer events, so it works with touch as well as a mouse. A tap that
   never moves is treated as a click — on a written line, that ticks it off. */
async function movePlanEntry(sIso,sIdx,tIso,tIdx){
  const src=plan[sIso]; if(!src||src[sIdx]==null) return;
  if(sIso===tIso && (tIdx===sIdx || tIdx===sIdx+1)) return;   /* dropped where it already is */
  snapshot();
  const [item]=src.splice(sIdx,1);
  if(sIso===tIso && tIdx>sIdx) tIdx--;                         /* indices shifted by the removal */
  (plan[tIso]=plan[tIso]||[]).splice(Math.max(0,Math.min(tIdx,plan[tIso].length)),0,item);
  if(!plan[sIso].length) delete plan[sIso];
  await savePlan(); render(); toast('Moved', true);
}
function wirePlanDrag(){
  const clearHints=()=>pane.querySelectorAll('.drop-before,.drop-after,.drop-day')
    .forEach(x=>x.classList.remove('drop-before','drop-after','drop-day'));
  pane.querySelectorAll('.plan-meal .drag-grip').forEach(grip=>{
    grip.onpointerdown=e=>{
      if(e.button!=null && e.button!==0) return;
      e.preventDefault();
      const row=grip.closest('.plan-meal');
      const sIso=row.dataset.iso, sIdx=+row.dataset.pidx;
      const x0=e.clientX, y0=e.clientY;
      let last=null, moved=false;
      const at=ev=>{
        const el=document.elementFromPoint(ev.clientX,ev.clientY);
        const overRow=el&&el.closest&&el.closest('.plan-meal');
        const overDay=el&&el.closest&&el.closest('.plan-day');
        if(overRow&&overRow!==row){
          const rc=overRow.getBoundingClientRect();
          return {row:overRow, after:ev.clientY >= rc.top+rc.height/2};
        }
        if(overDay) return {day:overDay};
        return null;
      };
      const move=ev=>{
        if(!moved){
          if(Math.hypot(ev.clientX-x0,ev.clientY-y0)<5) return;   /* still a tap, not a drag yet */
          moved=true; row.classList.add('dragging'); document.body.style.cursor='grabbing';
        }
        clearHints(); last=at(ev);
        if(last&&last.row) last.row.classList.add(last.after?'drop-after':'drop-before');
        else if(last&&last.day) last.day.classList.add('drop-day'); };
      const up=ev=>{
        document.removeEventListener('pointermove',move);
        document.removeEventListener('pointerup',up);
        row.classList.remove('dragging'); document.body.style.cursor=''; clearHints();
        if(!moved){                                     /* a plain tap: tick a written line off, nothing for the rest */
          if(grip.dataset.noteDone){ const [i,x]=grip.dataset.noteDone.split('|'); togglePlanDone(i,+x); }
          return;
        }
        const tgt=at(ev); if(!tgt) return;
        if(tgt.row){ let tIso=tgt.row.dataset.iso, tIdx=+tgt.row.dataset.pidx + (tgt.after?1:0);
          movePlanEntry(sIso,sIdx,tIso,tIdx); }
        else if(tgt.day){ const tIso=tgt.day.dataset.iso;
          movePlanEntry(sIso,sIdx,tIso,(plan[tIso]||[]).length); }
      };
      document.addEventListener('pointermove',move);
      document.addEventListener('pointerup',up);
    };
  });
}

/* ============ No-Brainer Dinner builder ============ */
function openNbd(iso,idx){
  userNavigated=true;
  nbdRef={iso:String(iso),idx:+idx}; nbdCook=null;
  mode='nbd'; editing=false; draft=null;
  document.body.dataset.view='detail'; render();
}
function nbdCurrent(){
  if(!nbdRef) return null;
  const arr=plan[nbdRef.iso]; const p=arr&&arr[nbdRef.idx];
  return (p&&p.tmpl==='nbd')?p:null;
}
async function nbdTouch(p){ p.updated=new Date().toISOString(); await savePlan(); render(); }
function nbdShop(name){
  if(!name) return;
  if(grocery.some(g=>norm(g.name)===norm(name))){ toast('“'+name+'” is already on the list'); return; }
  grocery.push({id:'g'+Date.now()+Math.random().toString(36).slice(2,6),name,qty:'',done:false,src:'no-brainer dinner'});
  saveGrocery(); toast('Added “'+name+'” to the shopping list');
}
function nbdLoadCombo(p,src){
  p.carb=src.carb?Object.assign({},src.carb):null;
  p.protein=src.protein?Object.assign({},src.protein):null;
  p.cook=src.cook||null;
  const groups=nbdVegGroups();
  p.veg=(src.veg||[]).map(v=>{
    const g=groups.find(g=>sing(norm(g.name))===sing(norm(v.name)));
    return g?{ids:g.ids.slice(),name:g.name}:{ids:[],name:v.name};   /* ids:[] → flagged unavailable */
  });
  p.fav=src.favId||src.id||null;
}
async function nbdComplete(p,usedIds){
  fridge=fridge.filter(f=>!usedIds.includes(f.id));
  p.status='completed'; p.done=true; p.updated=new Date().toISOString();
  const sig=nbdSig(p);
  nbdRecent=[{sig,carb:p.carb,protein:p.protein,veg:(p.veg||[]).map(v=>({name:v.name})),cook:p.cook||null,at:todayISO()},
    ...nbdRecent.filter(r=>r.sig!==sig)].slice(0,12);
  nbdCook=null;
  await savePlan(); await saveFridge(); await saveNbdRecent();
  mode='plan'; nbdRef=null; render();
  toast(usedIds.length?usedIds.length+' taken off the fridge list':'Marked as cooked', !!usedIds.length);
}
function nbdChips(list,sel,attr,extra){
  return list.map(o=>{
    const val=typeof o==='string'?o:o.val, lab=typeof o==='string'?o:o.lab, tag=(typeof o==='object'&&o.tag)||'';
    return `<button class="ball" data-${attr}="${esc(val)}" aria-pressed="${sel===val}">${esc(lab)}${tag?` <span class="n">${esc(tag)}</span>`:''}</button>`;
  }).join('')+(extra||'');
}

/* ============ Deliveroo basket builder ============ */
/* The stores name their aisles differently — Longdan especially — so map the
   86 raw category names onto a handful of families. Four palette colours,
   filled or hollow, gives ten legible groups without inventing new colours. */
const FAMS=[
 ['drinks','Drinks',/drink|water|juice|smoothie|\btea\b|coffee|mixer/i,'crumb',1],
 ['fresh','Fresh produce',/\bfruit\b|\bveg\b|vegetable|salad|herb/i,'sage',1],
 ['frozen','Frozen',/frozen|ice cream|dumpling|gyoza/i,'sage',0],
 ['meat','Meat & fish',/meat|poultry|\bfish\b|seafood|charcuterie|pork roll/i,'orange',1],
 ['bakery','Bakery',/baker|bread|pastr|cake|cookie|muffin/i,'orange',0],
 ['dairy','Dairy & chilled',/dairy|cheese|yoghurt|yogurt|milk|\begg/i,'rye',1],
 ['cupboard','Cupboard',/rice|pasta|pulse|noodle|\btin|\bcan\b|can&|cooking sauce|condiment|table sauce|\boil|stock|\bpaste|flour|sugar|baking|\bjam|honey|spread|store cupboard|nut & bean|coconut|preserved|dried|cereal/i,'rye',0],
 ['snacks','Snacks & sweets',/crisp|snack|biscuit|chocolate|sweet|confection|dessert/i,'crumb',0],
 ['deli','Deli & ready',/deli|\bdip|food to go|ready|pizza|brunch|breakfast|italian|weekend|dinner|bbq|picnic|platter|plantbase/i,'taupe',1],
 ['other','Everything else',/./,'taupe',0]];
function famOf(cat){ const c=String(cat||''); return FAMS.find(f=>f[2].test(c))||FAMS[FAMS.length-1]; }

/* Pack sizes are clean in this data — g, kg, ml, L, cl — so a real
   per-kilo / per-litre comparison is possible for most items. */
function unitPrice(price,size){
  const m=String(size||'').trim().match(/^([\d.]+)\s*(g|kg|ml|l|cl)$/i);
  if(!m) return null;
  const n=parseFloat(m[1]); if(!(n>0)) return null;
  const u=m[2].toLowerCase();
  if(u==='g')  return {v:price/(n/1000), u:'kg'};
  if(u==='kg') return {v:price/n,        u:'kg'};
  if(u==='ml') return {v:price/(n/1000), u:'L'};
  if(u==='l')  return {v:price/n,        u:'L'};
  if(u==='cl') return {v:price/(n/100),  u:'L'};
  return null;
}

/* Whole-egg cartons: a search for "eggs" turns up "egg noodles" and "egg
   mayonnaise" just as readily as an actual dozen eggs. Recognise the real
   cartons by name (not by the shop's own category — that's too coarse, and
   one mis-scraped row had "Eggs" as its category despite being cans of
   energy drink) so they can be pushed to the top and priced per egg. Liquid
   egg, egg white, egg pots and the like are still "eggs" but there's no
   honest way to say what one unit costs, so they're excluded rather than
   guessed at. */
const EGG_NOT_A_CARTON=/noodle|fried rice|\bmayo\b|mayonnaise|custard|creme egg|cadbury|meringue|quiche|benedict|florentine|sandwich|\bwrap\b|\bsalad\b|sushi|onigiri|frittata|omelette|pancake|waffle|batter|\bnog\b|liqueur|scotch egg|picnic egg|\bnest\b|chocolate|easter|marshmallow|\bmini\b|liquid egg|egg white|egg alternative|aquafaba|egg pot|boiled egg|egg powder|dried egg|egg yolk/i;
function eggCount(name,size){
  const words=String(name||'').toLowerCase().split(/\s+/);
  const eggIdx=words.findIndex(w=>/^eggs?[.,]?$/.test(w));
  if(eggIdx===-1) return null;
  let best=null,bestDist=Infinity;
  words.forEach((w,i)=>{
    const m=w.match(/^(\d{1,2})(?:s|pk|pack)?[.,]?$/);
    if(!m) return;
    const n=parseInt(m[1],10);
    if(n<1||n>30) return;
    const d=Math.abs(i-eggIdx);
    if(d<bestDist){ bestDist=d; best=n; }
  });
  if(best==null&&size){ const m=String(size).match(/^(\d{1,2})pk$/i); if(m) best=parseInt(m[1],10); }
  return best;
}
/* {count, perEgg} for a real carton, or null for anything else (including
   an egg product with no discoverable count — still "an egg thing", just
   not one we can price per egg). */
function eggInfo(item){
  const name=String(item.name||'');
  if(!/\begg/i.test(name)) return null;
  if(EGG_NOT_A_CARTON.test(name)) return null;
  const count=eggCount(name,item.size);
  return {count, perEgg:count?item.price/count:null};
}
async function loadAllCatalogues(){
  if(allCat||allBusy) return;
  allBusy=true; render();
  const base=API_BASE?'/data/':'data/';
  const out={};
  await Promise.all(STORES.map(async ([slug,name])=>{
    try{
      let items=null;
      /* Bulk compare: read the pre-parsed JSON (kept current by
         scripts/csv-to-json.py) so the browser doesn't parse ~14 MB of CSV.
         The CSV is the fallback if a JSON is missing (e.g. Bayley & Sage). */
      try{
        const r=await fetch(base+slug+'.json');
        if(r.ok){ const j=await r.json();
          items=j.items.map(a=>({name:a[0],price:a[1],cat:a[2],size:a[3],slug,store:j.store})); }
      }catch(e){}
      if(!items){
        const rc=await fetch(base+slug+'.csv'); if(!rc.ok) return;
        const p=parseShopCsv(await rc.text());
        if(p) items=p.items.map(i=>({...i,slug,store:p.store||name}));
      }
      if(items) out[slug]=items;
    }catch(e){}
  }));
  allCat=Object.keys(out).length?out:null;
  if(!allCat) shopErr='Could not load the other shops’ price lists here.';
  allBusy=false; render();
}
function searchEverywhere(q){
  if(!allCat) return [];
  const hits=[];
  for(const slug in allCat)
    for(const i of allCat[slug]) if(i.name.toLowerCase().includes(q)) hits.push(i);
  hits.forEach(i=>{ i.up=unitPrice(i.price,i.size); i.egg=eggInfo(i); });
  const eggQuery=/\begg/.test(q);
  hits.sort((a,b)=>{
    if(eggQuery){
      const ap=a.egg&&a.egg.perEgg!=null, bp=b.egg&&b.egg.perEgg!=null;
      if(ap&&bp) return a.egg.perEgg-b.egg.perEgg;
      if(ap!==bp) return ap?-1:1;
      const ac=a.egg?1:0, bc=b.egg?1:0;
      if(ac!==bc) return bc-ac;
    }
    if(a.up&&b.up&&a.up.u===b.up.u) return a.up.v-b.up.v;
    if(a.up&&!b.up) return -1;
    if(!a.up&&b.up) return 1;
    return a.price-b.price;
  });
  return hits.slice(0,120);

function parseCsvLine(line){
  const out=[]; let cur='', q=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(ch==='"'){ if(q && line[i+1]==='"'){ cur+='"'; i++; } else q=!q; }
    else if(ch===',' && !q){ out.push(cur); cur=''; }

}

   kept only as a fallback. One parser for all of them — Deliveroo shops and
   Boots — producing the same {store, items:[{name,price,cat,size}]} the JSON
   path produced. Header: store?,category,subcategory,product_name,pack_size,
   unit_price,price_gbp,… with a UTF-8 BOM. Returns null if it isn't one. */
function parseShopCsv(text){
  const rows=String(text).replace(/^\uFEFF/,'').trim().split(/\r?\n/);
  if(rows.length<2) return null;
  const head=parseCsvLine(rows[0]).map(h=>h.toLowerCase());
  const col=(...names)=>{ for(const n of names){ const i=head.indexOf(n); if(i>=0) return i; } return -1; };
  const iName=col('product_name','name','product');
  const iPrice=col('price_gbp','price');          /* exact — unit_price/was_price never win */
  /* `category` is the curated ~30-bucket taxonomy the family filter (FAMS) was
     tuned against — "Meat, Poultry, Fish" etc; `subcategory` is 190+ raw aisles
     that mostly fall through to "Everything else". Prefer the coarse one. */
  const iCat=col('category','subcategory');
  const iSize=col('pack_size','size');
  const iStore=col('store');
  /* Both present in every export but never read before: `was_price_gbp` is
     what the item cost before whatever `offer` describes ("15% off", "2 for
     £5"...). Surfaced wherever a price is shown — it's exactly the context
     that decides whether something on the gap is worth adding. */
  const iWas=col('was_price_gbp','was_price');
  const iOffer=col('offer','promotion');
  if(iName<0||iPrice<0) return null;               /* not a shop CSV — let the caller fall back */
  let store='';
  const items=[];
  for(let r=1;r<rows.length;r++){
    const c=parseCsvLine(rows[r]);
    const name=(c[iName]||'').replace(/^"|"$/g,'').trim();
    const price=parseFloat(String(c[iPrice]||'').replace(/[^0-9.]/g,''));
    if(!name || isNaN(price)) continue;
    if(iStore>=0 && c[iStore] && !store) store=c[iStore].trim();
    const was=iWas>=0?parseFloat(String(c[iWas]||'').replace(/[^0-9.]/g,'')):NaN;
    const offer=iOffer>=0?(c[iOffer]||'').trim():'';
    items.push({name,price,cat:(c[iCat]||'').trim()||'Other',size:(c[iSize]||'').trim(),
      was:(!isNaN(was)&&was>price)?was:null, offer});
  }
  return items.length?{store,items}:null;
}

/* what to add so the basket lands on or just over the minimum, with least waste */
function topUps(total,exclude,deep){

     stores updates shopStore immediately but shopCat only once its fetch
     resolves, so for one render there's a stale catalogue paired with the
     new store's (usually empty) basket total. That produced a burst of
     "Tips it over £15" suggestions from the wrong shop — a much longer list
     than the real one — which collapsed back down a moment later and read
     as the whole page bouncing. */
  if(short<=0||!shopCat||shopCat.slug!==shopStore) return [];
  const h=histFor(shopStore);
  const skip=new Set([...(exclude||[]), ...bask().map(i=>i.name)]);
  const band=deep?6:2.5;
  const staples=shopStaples[shopStore]||[];
  return shopCat.items
    .map(i=>{ const mine=priceOverrides[shopStore]&&priceOverrides[shopStore][i.name]!=null;
      return {...i, price:priceFor(shopStore,i.name,i.price), overridden:!!mine}; })
    .filter(i=>i.price>=short-0.001&&i.price<=short+band&&!skip.has(i.name))
    .map(i=>({...i,over:i.price-short,seen:(h[i.name]?h[i.name].b*4+h[i.name].a:0),staple:staples.includes(i.name)}))

       of everything else, as long as they actually fit the gap. Below that,
       "you've bought this before" only earns top billing when the item lands
       the order within £1 of £15 — a familiar item that overshoots by £4 is
       no more useful than any other, so past that band it's pure closeness. */

      if(a.staple!==b.staple) return b.staple-a.staple;
      const qa=a.seen>0&&a.over<=1, qb=b.seen>0&&b.over<=1;
      return (qb-qa)||a.over-b.over;

/* Best small combination of `units` (sorted desc) to cover `need`: reach it with
   the least overshoot, in as few items as possible; if nothing can reach it,
   the largest sum instead. Baskets are short, so a bounded search (<=4 items) is
   plenty and keeps the result readable — a £6 gap is a £6 item, or £4 + £2. */
function bestFill(units,need,MAX=4){
  const E=0.001; let best=null;
  const rank=c=>{
    const sum=c.reduce((a,j)=>a+units[j].price,0), reaches=sum>=need-E;
    return {idx:c.slice(),sum,reaches,over:reaches?sum-need:Infinity,n:c.length};
  };
  const better=(a,b)=>{
    if(!b) return true;
    if(a.reaches!==b.reaches) return a.reaches;
    return a.reaches ? (a.over<b.over-E || (Math.abs(a.over-b.over)<E && a.n<b.n))
                     : (a.sum>b.sum+E   || (Math.abs(a.sum-b.sum)<E   && a.n<b.n));
  };
  (function dfs(start,cur,sum){
    if(cur.length){ const c=rank(cur); if(better(c,best)) best=c; if(sum>=need-E) return; }
    if(cur.length>=MAX) return;
    for(let j=start;j<units.length;j++){ cur.push(j); dfs(j+1,cur,sum+units[j].price); cur.pop(); }
  })(0,[],0);

}
/* Greedy pack. An item that already clears £15 stands alone (combining it only
   wastes the over-minimum). Then, per order: the most expensive item left goes
   in first, and bestFill() closes the gap to £15 with the tightest combination
   of the next few items. Whatever is left pools into the last order, over or
   under. Empty orders are dropped — asking for more orders than the basket can
   fill just gives you fewer. */
function planOrders(k){
  let units=[];
  bask().forEach(i=>{ for(let n=0;n<i.qty;n++) units.push({name:i.name,price:i.price,size:i.size}); });
  units.sort((a,b)=>b.price-a.price);

  while(units.length && units[0].price>=T-E && g.length<k-1){
    const u=units.shift(); g.push({items:[u],total:u.price});
  }
  for(let slot=g.length; slot<k-1 && units.length; slot++){
    const seed=units.shift();
    const o={items:[seed],total:seed.price};
    if(o.total<T-E && units.length){
      bestFill(units,T-o.total).sort((a,b)=>b-a).forEach(j=>{
        o.total+=units[j].price; o.items.push(units.splice(j,1)[0]);

              <button data-add="${esc(i.name)}|${i.price}|${esc(i.size||'')}">
                <span class="r-name">${esc(i.name)}${i.egg&&i.egg.count?` <span class="chip">${i.egg.count} eggs</span>`:''}</span>
                <span class="r-cat">${esc(i.cat)}</span>

                ${i.egg&&i.egg.perEgg!=null?`<span class="r-unit">${(i.egg.perEgg*100).toFixed(0)}p/egg</span>`:''}
                <span class="r-price">£${i.price.toFixed(2)}</span></button>
              <button class="star-btn" type="button" data-staple="${esc(i.name)}" aria-pressed="${staple}"
                aria-label="${staple?'Stop always adding '+esc(i.name):'Always add '+esc(i.name)+' to top up an order'}">${staple?'★':'☆'}</button>
              </li>`;}).join('');
        }).join('')}</ul>`;})()
      :(q.length>1&&shopScope==='store'&&shopCat?`<p class="home-none" style="margin-top:10px">Nothing matching that.</p>`:'')}

    ${shopScope==='baskets'?(()=>{
      const hits=[];
      for(const slug in basket) (basket[slug]||[]).forEach(i=>{ if(q.length>1&&i.name.toLowerCase().includes(q))
        hits.push({...i,slug,store:(STORES.find(s=>s[0]===slug)||[,slug])[1]}); });

      return hits.length?`<ul class="results" style="margin-top:8px">${hits.map(i=>`
        <li><button data-jump="${esc(i.slug)}">
          <span class="r-name">${esc(i.name)}</span>
          <span class="r-store">${esc(i.store)}</span>
          <span class="r-size">×${i.qty}</span>
          <span class="r-price">£${(i.price*i.qty).toFixed(2)}</span></button></li>`).join('')}</ul>`
        :`<p class="home-none" style="margin-top:10px">Not in any basket.</p>`;})():''}

    ${shopScope==='all'?(gResults.length?(()=>{
      const shown=gResults.slice(0,60);
      const bestEgg=shown.find(i=>i.egg&&i.egg.perEgg!=null);
      const best=bestEgg||shown.find(i=>i.up);
      return `<ul class="results compare">${shown.map(i=>`
        <li class="${i===best?'best':''}"><button data-gadd="${esc(i.slug)}|${esc(i.name)}|${i.price}|${esc(i.size||'')}">
          <span class="r-name">${esc(i.name)}${i.egg&&i.egg.count?` <span class="chip">${i.egg.count} eggs</span>`:''}${i===best?` <span class="chip">cheapest per ${bestEgg?'egg':i.up.u}</span>`:''}</span>
          <span class="r-store">${esc(i.store)}</span>
          <span class="r-size">${esc(i.size||'')}</span>
          <span class="r-unit">${i.egg&&i.egg.perEgg!=null?(i.egg.perEgg*100).toFixed(0)+'p/egg':(i.up?'£'+i.up.v.toFixed(2)+'/'+i.up.u:'—')}</span>
          <span class="r-price">£${i.price.toFixed(2)}</span></button></li>`).join('')}</ul>
        ${gResults.length>60?`<p class="hint">Showing the 60 best value of ${gResults.length} matches.</p>`:''}`;})()
      :(q.length>1&&allCat?`<p class="home-none" style="margin-top:10px">Nothing matching that in any shop.</p>`
        :(allBusy?'':`<p class="home-none" style="margin-top:10px">Type at least two letters to compare across every shop.</p>`)))
     :''}


    <div class="meter">
      <div class="meter-bar"><span style="width:${Math.min(100,total/MIN_ORDER*100).toFixed(1)}%" class="${total>=MIN_ORDER?'done':''}"></span></div>
      <div class="meter-read">

        ${total>=MIN_ORDER?`<span class="chip">over by £${(total-MIN_ORDER).toFixed(2)}</span>`
          :`<span class="short">£${short.toFixed(2)} to go</span>`}
      </div>
    </div>

    ${items.length?`<ul class="basket">${items.map((i,n)=>{
      const catPrice=shopCat&&(shopCat.items.find(x=>x.name===i.name)||{}).price;
      const hasOverride=!!(priceOverrides[shopStore]&&priceOverrides[shopStore][i.name]!=null);
      return `<li><span class="b-name">${esc(i.name)}${i.size?` <span class="item-qty">${esc(i.size)}</span>`:''}</span>

        ${editingPriceIdx===n
          ? `<input type="number" id="ep-input" step="0.01" min="0" value="${i.price}" style="width:70px;font-family:var(--mono);font-size:13px;padding:5px 7px;border:2.5px solid var(--crumb);border-radius:var(--wob3)">
             <button class="link-btn" id="ep-save">Save</button>
             ${hasOverride&&catPrice!=null?`<button class="link-btn" id="ep-reset">Reset to £${catPrice.toFixed(2)}</button>`:''}

      <div class="cook-actions" style="margin-top:12px">
        <button class="pill solid" id="shop-done">Order lined up — set it aside</button>

        <button class="link-btn" id="shop-tolist">Copy to grocery list</button>

    :`<p class="home-none" style="margin:14px 0">Basket is empty. Search below, or pick from your usuals.</p>`}

    ${putAwayList?`<div class="cookoff" style="margin-top:18px">
      <h4 style="font-family:var(--mono);font-size:11px;letter-spacing:.15em;text-transform:uppercase;color:var(--rye);margin:0 0 4px;font-weight:400">Put the shopping away</h4>
      <p class="hint" style="margin:0 0 8px">Untick anything that is not food, or that you are eating straight away. Dates come from the storage data.</p>
      ${putAwayList.map((p,i)=>`<div class="review-row">
        <input type="checkbox" ${p.on?'checked':''} data-pl="${i}">
        <span>${esc(p.name)}${p.until?` <span class="chip">${useByChip(p.until).replace(/<[^>]+>/g,'')}</span>`:''}</span>
        <span class="item-qty">${esc(p.qty||'')}</span>
        <select data-plshelf="${i}">${SHELVES.map(s=>`<option ${p.shelf===s?'selected':''}>${s}</option>`).join('')}</select>
      </div>`).join('')}
      <div class="edit-actions" style="margin-top:10px;padding:0;border:0">
        <button class="pill solid" id="pl-go">Into the kitchen</button>
        <button class="pill" id="pl-skip">Not this time</button>
      </div></div>`:''}

    ${items.length?renderCarveMany():''}

    ${short>0&&tops.length?`<div class="useup" style="margin-top:20px"><h4>Tips it over £${MIN_ORDER}</h4>
      <ul class="topups">${(topsOpen?tops:tops.slice(0,4)).map(t=>`
        <li><button data-top="${esc(t.name)}|${t.price}|${esc(t.size||'')}">
          <span class="t-name">${t.staple?'★ ':''}${esc(t.name)} ${priceBadge(t,t.overridden)}</span>
          <span class="t-price">${wasPriceHTML(t,t.overridden)} £${t.price.toFixed(2)}</span>
          <span class="t-over">→ £${(total+t.price).toFixed(2)}${t.seen>3?' · you buy this':''}</span>
        </button></li>`).join('')}</ul>
      ${tops.length>4?`<button class="link-btn" id="tops-more" style="margin-top:8px">${topsOpen?'Show fewer':'Show all '+tops.length+' options'}</button>`:''}

    <div class="add-item" style="grid-template-columns:1fr 110px auto;margin-top:16px">
      <label><span class="picker-label">Or add by hand</span><input id="man-name" placeholder="Lime" autocomplete="off"></label>
      <label><span class="picker-label">Price</span><input id="man-price" type="number" step="0.01" min="0" placeholder="0.30"></label>
      <button class="pill" id="man-add" style="align-self:end;padding:10px 16px">Add</button>

    ${usuals.length?`<div class="shop-usuals"><h4>Your usuals here</h4>
      <div class="usual-chips">${usuals.map(([name,e])=>{ const staple=isStaple(shopStore,name);
        return `<span class="usual-wrap">
        <button class="ball" data-usual="${esc(name)}">${esc(name.length>34?name.slice(0,32)+'…':name)}
          <span class="n">${e.b?'bought '+e.b+'×':'listed '+e.a+'×'}</span></button>
        <button class="star-btn" type="button" data-staple="${esc(name)}" aria-pressed="${staple}"
          aria-label="${staple?'Stop always adding '+esc(name):'Always add '+esc(name)+' to top up an order'}">${staple?'★':'☆'}</button>
        </span>`;}).join('')}</div></div>`:''}
  </article>`;

  const back=$('#back'); if(back) back.onclick=()=>{ mode='home'; render(); };
  pane.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{
    shopStore=b.dataset.jump; basketQ=''; shopCat=null; loadCatalogue(shopStore); });
  pane.querySelectorAll('[data-store]').forEach(b=>b.onclick=()=>{
    shopStore=b.dataset.store; shopQ=''; refocus='shop-store'; editingPriceIdx=null;
    if(shopStore===BOOTS_SLUG){ shopCat=null; loadBootsProducts(); } else loadCatalogue(shopStore); });
  /* loadCatalogue/loadBootsProducts re-render the whole pane mid-click (once for
     the loading state, again once the price list arrives) — each rebuild is a
     fresh .shop-stores element, so it starts back at scrollLeft 0. Restore the
     row's last scroll position immediately so it doesn't visibly snap to the
     start and then jump back once the fetch resolves. */
  const shopStoresEl=pane.querySelector('.shop-stores');
  if(shopStoresEl){ shopStoresEl.scrollLeft=shopStoresScroll;
    shopStoresEl.onscroll=()=>{ shopStoresScroll=shopStoresEl.scrollLeft; }; }
  if(refocus==='shop-store' && !shopBusy){ refocus=null;
    shopStoresEl?.querySelector('.ball[aria-pressed="true"]')?.scrollIntoView({inline:'center',block:'nearest'}); }
  const sq=$('#shop-q');
  if(sq){ sq.oninput=()=>{ shopQ=sq.value; shopFam=''; refocus='shop-q';
    clearTimeout(shopSearchT);
    /* every-shop search scans ~100k rows — don't do it per keystroke. Also
       remember where the caret actually was: re-render used to always park it
       at the end of the line, so editing anywhere but the last character kept
       bouncing the next keystroke to the wrong place. */
    const caret=sq.selectionStart;
    shopSearchT=setTimeout(()=>{ refocusCaret=caret; render(); }, shopScope==='all'?200:60);
  }; }
  pane.querySelectorAll('[data-fam]').forEach(b=>b.onclick=()=>{ shopFam=b.dataset.fam; render(); });
  pane.querySelectorAll('[data-staple]').forEach(b=>b.onclick=async()=>{
    await toggleStaple(shopStore,b.dataset.staple); render();
  });
  pane.querySelectorAll('[data-scope]').forEach(b=>b.onclick=()=>{
    shopScope=b.dataset.scope; shopFam='';
    if(shopScope==='all') loadAllCatalogues(); else render(); });
  const tm=$('#tops-more'), tm2=$('#tops-more2');
  if(tm) tm.onclick=()=>{ topsOpen=!topsOpen; render(); };
  if(tm2) tm2.onclick=()=>{ topsOpen=!topsOpen; render(); };
  pane.querySelectorAll('[data-gadd]').forEach(b=>b.onclick=async()=>{
    const [slug,n,p,s]=b.dataset.gadd.split('|');
    const prev=shopStore;
    shopStore=slug;
    const ex=bask().find(i=>i.name===n);
    if(ex) ex.qty++; else bask().push({name:n,price:+p,size:s||'',qty:1});
    bump(slug,n,'a');
    await saveBasket(); await saveHist();
    if(prev!==slug){ shopCat=null; loadCatalogue(slug); }
    else render();
    toast('Added to the '+(STORES.find(x=>x[0]===slug)||[,slug])[1]+' basket');
  });
  const addItem=async(name,price,size)=>{
    const ex=bask().find(i=>i.name===name);
    if(ex) ex.qty++; else bask().push({name,price:+price,size:size||'',qty:1});
    bump(shopStore,name,'a');
    await saveBasket(); await saveHist(); render();
  };
  pane.querySelectorAll('[data-add],[data-top]').forEach(b=>b.onclick=()=>{
    const [n,p,s]=(b.dataset.add||b.dataset.top).split('|'); addItem(n,p,s); });
  pane.querySelectorAll('[data-usual]').forEach(b=>b.onclick=()=>{
    const n=b.dataset.usual;
    const hit=shopCat&&shopCat.items.find(i=>i.name===n);
    if(hit) addItem(hit.name,hit.price,hit.size);
    else { const m=$('#man-name'); if(m){ m.value=n; m.focus(); } }
  });
  pane.querySelectorAll('[data-inc]').forEach(b=>b.onclick=async()=>{ bask()[+b.dataset.inc].qty++; await saveBasket(); render(); });
  pane.querySelectorAll('[data-dec]').forEach(b=>b.onclick=async()=>{
    const i=bask()[+b.dataset.dec]; i.qty--; unbump(shopStore,i.name,1);
    if(i.qty<1) bask().splice(+b.dataset.dec,1);
    await saveBasket(); await saveHist(); render(); });
  pane.querySelectorAll('[data-bx]').forEach(b=>b.onclick=async()=>{
    const it=bask()[+b.dataset.bx]; unbump(shopStore,it.name,it.qty);
    bask().splice(+b.dataset.bx,1); editingPriceIdx=null; await saveBasket(); await saveHist(); render(); });
  /* Correcting a stale price: a small inline editor on the basket row, saved
     as a per-store override so it also applies next time this item is added
     fresh from search — the CSV export is a snapshot and drifts. */
  pane.querySelectorAll('[data-editprice]').forEach(b=>b.onclick=()=>{ editingPriceIdx=+b.dataset.editprice; render(); });
  const epi=$('#ep-input');
  if(epi){
    epi.focus(); epi.select();
    const saveEditedPrice=async()=>{
      const idx=editingPriceIdx, item=bask()[idx]; editingPriceIdx=null;
      const v=parseFloat(epi.value);
      if(item && v>0){ item.price=v; await setPriceOverride(shopStore,item.name,v); await saveBasket(); }
      render();
    };
    epi.onkeydown=e=>{
      if(e.key==='Enter'){ e.preventDefault(); saveEditedPrice(); }
      else if(e.key==='Escape'){ editingPriceIdx=null; render(); }
    };
    const es=$('#ep-save'); if(es) es.onclick=saveEditedPrice;
    const ec=$('#ep-cancel'); if(ec) ec.onclick=()=>{ editingPriceIdx=null; render(); };
    const er=$('#ep-reset'); if(er) er.onclick=async()=>{
      const idx=editingPriceIdx, item=bask()[idx]; editingPriceIdx=null;
      if(item){
        await clearPriceOverride(shopStore,item.name);
        const cp=shopCat&&shopCat.items.find(x=>x.name===item.name);
        if(cp) item.price=cp.price;
        await saveBasket();
      }
      render();
    };
  }
  const ma=$('#man-add'); if(ma) ma.onclick=()=>{
    const n=$('#man-name').value.trim(), p=parseFloat($('#man-price').value);
    if(!n||!(p>0)){ $('#man-name').focus(); return; }
    addItem(n,p,'');
  };
  const mn=$('#man-name'); if(mn) mn.onkeydown=e=>{ if(e.key==='Enter') $('#man-price').focus(); };
  const mp=$('#man-price'); if(mp) mp.onkeydown=e=>{ if(e.key==='Enter') ma.click(); };
  pane.querySelectorAll('[data-carve]').forEach(b=>b.onclick=async()=>{
    const o=(carveOrders().orders)[+b.dataset.carve];
    if(!o||!o.items.length) return;
    snapshot();
    lineUpOrder(shopStore,o.items);
    takeUnitsFromBasket(shopStore,o.items);   /* only these units leave the basket — everything else stays put */
    await saveBasket(); await saveShopOrders(); render();
    toast('Order lined up', true);
  });
  pane.querySelectorAll('[data-unlock]').forEach(b=>b.onclick=async()=>{
    await dissolveOrder(b.dataset.unlock); render();
    toast('Back in the basket to edit');
  });
  const vl=$('#view-lined'); if(vl) vl.onclick=()=>{ mode='shoporders'; render(); };
  pane.querySelectorAll('[data-pl]').forEach(el=>el.onchange=()=>{ putAwayList[+el.dataset.pl].on=el.checked; });
  pane.querySelectorAll('[data-plshelf]').forEach(el=>el.onchange=()=>{ const i=+el.dataset.plshelf;
    putAwayList[i].shelf=el.value; putAwayList[i].until=sugDate(putAwayList[i].name,el.value); });
  const pg2=$('#pl-go'); if(pg2) pg2.onclick=async()=>{
    let n=0,m=0;
    putAwayList.filter(p=>p.on).forEach(p=>{ const res=addToFridge({name:p.name,qty:p.qty,shelf:p.shelf,until:p.until}); res.merged?m++:n++; });
    putAwayList=null; await saveFridge(); await savePutaway(); render();
    toast(n+' into the kitchen'+(m?', '+m+' merged':''));
  };
  const pc2=$('#pl-skip'); if(pc2) pc2.onclick=async()=>{ putAwayList=null; await savePutaway(); render(); };
  const sd=$('#shop-done'); if(sd) sd.onclick=async()=>{
    const items=bask().flatMap(i=>Array.from({length:i.qty},()=>({name:i.name,price:i.price,size:i.size||''})));
    if(!items.length) return;
    snapshot();
    lineUpOrder(shopStore,items);
    basket[shopStore]=[];
    await saveBasket(); await saveShopOrders(); render();
    toast('Order lined up', true);
  };
  const sc=$('#shop-clear'); if(sc) sc.onclick=async()=>{ snapshot();
    bask().forEach(i=>unbump(shopStore,i.name,i.qty));
    basket[shopStore]=[]; await saveBasket(); await saveHist(); render(); toast('Basket emptied', true); };
  const st=$('#shop-tolist'); if(st) st.onclick=async()=>{
    if(shopStore===BOOTS_SLUG){ toast('Boots items stay out of the grocery list'); return; }
    let n=0;
    bask().forEach(i=>{ if(!grocery.some(g=>norm(g.name)===norm(i.name))){
      grocery.push({id:'g'+Date.now()+Math.random().toString(36).slice(2,6),
        name:i.name,qty:i.qty>1?i.qty+'×':'',done:false,src:shopCat?shopCat.store:'Deliveroo'}); n++; } });
    await saveGrocery(); render(); toast(n+' copied to the grocery list');
  };
  if(refocus==='shop-q'){ refocus=null; const n=$('#shop-q');
    if(n){ const c=refocusCaret==null?n.value.length:Math.min(refocusCaret,n.value.length);
      n.focus(); n.setSelectionRange(c,c); }
    refocusCaret=null; }
}

/* ============ lined-up Deliveroo orders, across every shop ============
   Reached from the "Lined-up orders" link on any store's basket page — not a
   bookmarkable route of its own (see hashFor), same as the recipe editor or
   the No-Brainer builder. Two lists: the ones still to actually place on
   Deliveroo, and everything placed before, oldest dropping off past 60. */
function renderShopOrders(){
  const lined=shopOrders.filter(o=>o.status==='lined').sort((a,b)=>a.linedAt<b.linedAt?-1:1);
  const placed=shopOrders.filter(o=>o.status==='placed').sort((a,b)=>b.placedAt.localeCompare(a.placedAt));

  pane.innerHTML=`<article class="card">
    <div class="card-head">
      <div style="flex:1;min-width:180px"><h2>Lined-up orders</h2>
        <p class="blurb">Everything you've grouped into an order, across every shop. Mark one placed once you've actually put it through on Deliveroo — that's the point purchase history and the fridge reminder get recorded.</p></div>
      <div class="head-actions"><button class="pill back-only" id="back">← Deliveroo</button></div>
    </div>

    <h3 class="section-title" style="margin-top:20px">Ready to place</h3><div class="section-rule"></div>
    ${lined.length?lined.map(o=>`<div class="order lined" style="margin-bottom:12px">

    try{
      const resp=await fetch(AI_ENDPOINT,{
        method:'POST',headers:apiHeaders({'Content-Type':'application/json'}),
        body:JSON.stringify({model:AI_MODEL,max_tokens:1000,messages:[{role:'user',content:
          'Parse this recipe into JSON. Respond with ONLY the JSON object, no markdown fences, no preamble. Shape: {"name":string,"blurb":"one short sentence describing the dish, written in your own words","makesQty":number,"makesUnit":"servings or ml or pancake etc","kcal":integer estimate of total calories for the whole recipe,"ingredients":[{"qty":number or null,"unit":"tsp/Tbsp/cup/g/ml or empty","name":"specific ingredient name"}],"method":["each step rewritten concisely in your own words"]} . Use null qty for garnish/optional/free-text lines. Recipe text follows:\n\n'+txt}]})});
      if(!resp.ok) throw new Error('http '+resp.status);
      const data=await resp.json();
      const raw=(data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');

      if(!p||!p.name||!Array.isArray(p.ingredients)) throw new Error('shape');
      const qOf=q=>(q==null||q==='')?null:(Number.isFinite(+q)?+q:null);
      draft={_isNew:true,img:null,
        name:String(p.name),blurb:String(p.blurb||''),
        icon:guessIcon({name:p.name,ingredients:p.ingredients}),
        kcal:Number.isFinite(+p.kcal)?Math.round(+p.kcal):null,
        makesQty:Number.isFinite(+p.makesQty)?+p.makesQty:2,
        makesUnit:String(p.makesUnit||'servings'),
        ingredients:p.ingredients.map(i=>({qty:qOf(i.qty),unit:String(i.unit||''),name:String(i.name||'')})).filter(i=>i.name),
        method:(p.method||[]).map(String).filter(Boolean)};
      pasteBusy=false; pasteText=''; mode='recipe'; editing=true; render();
      toast('Check it over, then save');
    }catch(e){
      pasteBusy=false; render();
      const m=String(e&&e.message||e);
      banner(/http 401/.test(m) ? 'The recipe importer needs the owner key — open the app from your ?k=… link first.'
        : /http 501/.test(m) ? 'The recipe importer is not set up on this deployment (no AI key).'
        : /http 5\d\d|http 4\d\d/.test(m) ? 'The importer service had a problem — try again in a moment.'
        : 'Could not make sense of that text as a recipe. Ingredients plus method usually does it.');
    }
  };
}

/* ---------- hash routing --------------------------------------------------
   Each section gets a real URL (#/fridge, #/recipe/nuoc-cham …) so pages are
   bookmarkable, shareable and the browser Back button behaves. Kept in one
   file so there is a single copy of the app to maintain. */
const ROUTES=['home','recipes','fridge','grocery','plan','shop','settings'];
let routing=false;                    /* guards against hashchange feedback loops */
let booting=true;                     /* true until saved data has hydrated; keeps
                                        syncHash from rewriting a deep link to #/
                                        before the recipe it points at exists */

function hashFor(){
  if(SHARE) return null;
  if(editing||mode==='paste'||mode==='nbd'||mode==='shoporders') return null;   /* transient states — leave the URL where it was */
  if(mode==='recipe') return currentId?'#/recipe/'+encodeURIComponent(currentId):null;
  /* ^ a recipe view with nothing selected has no honest URL — leaving the hash
       alone beats claiming the user is on the home screen while they are not */
  if(mode==='home') return '#/';
  return ROUTES.includes(mode)?'#/'+mode:'#/';
}
function syncHash(){
  if(SHARE||booting) return;
  const h=hashFor();
  if(!h || location.hash===h) return;
  /* pushState changes the URL WITHOUT firing hashchange, so the app's own
     navigation never bounces back through applyHash (which was clobbering the
     editor and paste screens). Back/Forward still fires hashchange. */
  try{ history.pushState(null,'',h); }
  catch(e){ routing=true; location.hash=h; }
}
function applyHash(){
  if(SHARE) return;
  const h=location.hash.replace(/^#\/?/,'');
  const m=h.match(/^recipe\/(.+)$/);
  if(m){
    const id=decodeURIComponent(m[1]);
    if(find(id)){ if(id!==currentId) resetRecipeView(); currentId=id; mode='recipe'; editing=false; return; }
    /* recipe not loaded yet — hold the route so the bookmark still resolves once
       saved recipes arrive, rather than snapping to Home */
    if(booting){ currentId=id; mode='recipe'; editing=false; return; }
  }
  const seg=h.split('/')[0];
  mode = ROUTES.includes(seg) ? seg : 'home';
  editing=false;
}
window.addEventListener('hashchange',()=>{
  if(SHARE) return;
  if(routing){ routing=false; return; }   /* our own fallback write, not a real navigation */
  userNavigated=true;
  applyHash(); render();
});

/* A ball carrying 5+ characters of text reads better as a rounded rectangle
   than as the little dough-blob shape. Decided per button after every render. */
function shapeBalls(){
  pane.querySelectorAll('.ball').forEach(b=>{
    b.classList.toggle('rect', (b.textContent||'').replace(/\s+/g,' ').trim().length>=5);
  });
}
function render(){
  armed=null;
  fridgeCacheClear();       /* fridge-match caches live for exactly one repaint */
  syncHash();
  renderNav();
  renderTabbar();
  renderBody();
  shapeBalls();
}
function renderBody(){
  if(mode==='fridge'&&!SHARE){ renderFridge(); return; }
  if(mode==='grocery'&&!SHARE){ renderGrocery(); return; }
  if(mode==='plan'&&!SHARE){ renderPlan(); return; }
  if(mode==='paste'&&!SHARE){ renderPaste(); return; }
  if(mode==='nbd'&&!SHARE){ renderNbd(); return; }
  if(mode==='settings'&&!SHARE){ renderSettings(); return; }
  if(mode==='shop'&&!SHARE){ renderShop(); return; }
  if(mode==='shoporders'&&!SHARE){ renderShopOrders(); return; }
  if(mode==='home'&&!SHARE){ renderHome(); return; }
  if(mode==='recipes'){ renderRecipes(); return; }
  (editing&&!SHARE)?renderEditor():renderRecipe();
}
