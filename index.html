$('#import-file').onchange=e=>{
  const f=e.target.files[0]; if(!f) return;
  const fr=new FileReader();
  fr.onload=async()=>{
    /* stage the whole backup into a clean object first — a field that is present
       but the wrong type rejects the whole file, so a malformed backup can never
       half-apply or silently blank a store */
    let staged;
    try{
      const d=JSON.parse(fr.result);
      const arr=(v,name)=>{ if(v===undefined) return []; if(!Array.isArray(v)) throw new Error(name+' is not a list'); return v; };
      const obj=(v,name)=>{ if(v===undefined) return {}; if(!v||typeof v!=='object'||Array.isArray(v)) throw new Error(name+' is not an object'); return v; };
      staged={};
      if(Array.isArray(d)||Array.isArray(d.recipes)){        /* older backup: one flat list */
        const list=Array.isArray(d)?d:d.recipes;
        const ids=new Set(seed().map(s=>s.id));
        staged.mine=list.filter(r=>r&&!ids.has(r.id));
        staged.overrides={}; list.filter(r=>r&&ids.has(r.id)).forEach(r=>{ const p=diffFromSeed(r.id,r); if(p) staged.overrides[r.id]=p; });
      }else{
        staged.mine=arr(d.mine,'recipes'); staged.overrides=obj(d.overrides,'overrides');
      }
      if(!staged.mine.every(r=>r&&typeof r.id==='string'&&typeof r.name==='string')) throw new Error('recipe entries are malformed');
      staged.removed=arr(d.removed,'removed').filter(x=>typeof x==='string');
      staged.fridge=arr(d.fridge,'fridge'); staged.grocery=arr(d.grocery,'grocery list');
      staged.plan=obj(d.plan,'meal plan'); staged.foodPrefs=obj(d.foodPrefs,'food prefs');
      /* a backup taken before to-dos had ids still restores — give them one now */
      staged.todos=arr(d.todos,'to-dos').map(t=>(t&&!t.id)?{...t,id:todoId()}:t);
      staged.menu=arr(d.menu,'menu'); staged.nbdFav=arr(d.nbdFav,'NBD favourites'); staged.nbdRecent=arr(d.nbdRecent,'NBD recent');
      staged.cookedIds=arr(d.cookedIds,'cooked ids').filter(x=>typeof x==='string');
      staged.basket=obj(d.basket,'baskets'); staged.shopHist=obj(d.shopHist,'shop history');
      staged.shopOrders=arr(d.shopOrders,'Deliveroo orders');
      staged.shopStaples=obj(d.shopStaples,'usual items'); staged.priceOverrides=obj(d.priceOverrides,'price corrections');
    }catch(err){ banner('That backup could not be read — '+(err&&err.message||'unrecognised format')+'. Nothing was changed.'); return; }

    const before={mine,overrides,removed,fridge,grocery,plan,todos,foodPrefs,menu,nbdFav,nbdRecent,cookedIds,basket,shopHist,shopOrders,shopStaples,priceOverrides};
    try{
      /* Undoable: a restore replaces every store, and picking the wrong file
         used to be recoverable only from another backup. */
      snapshot();
      ({mine,overrides,removed,fridge,grocery,plan,todos,foodPrefs,menu,nbdFav,nbdRecent,cookedIds,basket,shopHist,shopOrders,shopStaples,priceOverrides}=staged);
      rebuild(); currentId=recipes[0]?.id??null; editing=false; mode='recipes';
      /* persist every restored store as one batch — baskets and history included */
      await Promise.all([
        saveRecipeStores(), saveFridge(), saveGrocery(), savePlan(), saveTodos(),
        savePrefs(), saveMenu(), saveNbdFav(), saveNbdRecent(), saveCooked(),
        saveBasket(), saveHist(), saveShopOrders(), saveStaples(), savePriceOverrides()
      ]);
      render(); toast('Restored '+recipes.length+' recipes', true);
    }catch(err){
      ({mine,overrides,removed,fridge,grocery,plan,todos,foodPrefs,menu,nbdFav,nbdRecent,cookedIds,basket,shopHist,shopOrders,shopStaples,priceOverrides}=before);
      undoSnap=null;                    /* rolled back already — nothing to undo */
      rebuild(); render();
      banner('The backup could not be applied cleanly — nothing was changed. '+(err&&err.message||err));
    }
  };
  fr.readAsText(f); e.target.value='';
};
async function doReset(){
  snapshot(); removed=[]; overrides={}; mine=[]; rebuild();
  currentId=recipes[0]?.id??null;
  editing=false; mode='recipes';
  await saveRecipeStores(); render(); toast('Everything reset to the shipped recipes', true);
}

/* ============ boot ============ */
(async function init(){
 try{
  /* Paint immediately from the embedded recipes so the page never sits blank
     while the network wakes up. The saved data merges in a moment later. */
  rebuild();
  if(SHARE){
    document.body.classList.add('shared');
    if(SHARE_ONE){
      /* isolated single-recipe link: fetch ONLY the snapshot, nothing else */
      document.body.dataset.view='detail'; mode='recipe';
      let snap=null; try{ snap=await sget('hbs:share.'+SHARE_ONE); }catch(_){}
      recipes = (snap && snap.recipe && snap.recipe.id) ? [snap.recipe] : [];
      currentId = recipes[0]?.id || SHARE_ONE;
      render();
      return;
    }
    if(SHARE_ID && find(SHARE_ID)){ currentId=SHARE_ID; mode='recipe'; }
    else { mode='recipes'; currentId=null; }
  } else {
    currentId=recipes[0]?.id??null;
    applyHash();
  }
  document.body.dataset.view='detail';
  render();

  /* Load every store in parallel instead of one request after another —
     eleven sequential round-trips were the reason startup felt slow. */
  /* In share mode fetch ONLY the three recipe keys. The fridge, grocery list,
     meal plan, baskets and purchase history are never requested at all. */
  const [_mine,_over,_rem,_fri,_gro,_pl,_td,_bk,_hs,_pr,_mn,_nf,_nr,_ck,_pa,_so,_st,_po,meta] = SHARE
    ? [...await Promise.all([sget(S.mine), sget(S.overrides), sget(S.removed)]),
       null,null,null,null,null,null,null,null,null,null,null,null,null,null,null,null]
    : await Promise.all([
        sget(S.mine), sget(S.overrides), sget(S.removed), sget(S.fridge),
        sget(S.grocery), sget(S.plan), sget(S.todos), sget(S.basket),
        sget(S.hist), sget(S.prefs), sget(S.menu), sget(S.nbdfav),
        sget(S.nbdrecent), sget(S.cooked), sget(S.putaway), sget(S.orders),
        sget(S.staples), sget(S.prices), sget(S.meta)
      ]);
  mine      = _mine || [];
  overrides = _over || {};
  removed   = _rem  || [];
  fridge    = _fri  || [];
  grocery   = _gro  || [];
  plan      = _pl   || {};
  todos     = _td   || [];
  basket    = _bk   || {};
  shopHist  = _hs   || {};
  foodPrefs = _pr   || {};
  menu      = _mn   || [];
  nbdFav    = _nf   || [];
  nbdRecent = _nr   || [];
  cookedIds = _ck   || [];
  putAwayList = (Array.isArray(_pa)&&_pa.length) ? _pa : null;
  shopOrders  = Array.isArray(_so) ? _so : [];
  shopStaples = _st || {};
  priceOverrides = _po || {};

  /* one-time lift from the old single-blob store into the split stores */
  if(!meta && !API_BASE){
    const legacy=await sget(LEGACY);
    if(Array.isArray(legacy)&&legacy.length){
      const ids=new Set(seed().map(s=>s.id));
      mine=legacy.filter(r=>!ids.has(r.id));
      legacy.filter(r=>ids.has(r.id)).forEach(r=>{ const p=diffFromSeed(r.id,r); if(p) overrides[r.id]=p; });
      const oldRemoved=await sget(LEGACY+':removed');
      if(Array.isArray(oldRemoved)) removed=oldRemoved;
      fridge  = fridge.length ?fridge : (await sget(LEGACY+':fridge')||[]);
      grocery = grocery.length?grocery: (await sget(LEGACY+':grocery')||[]);
      plan    = Object.keys(plan).length?plan:(await sget(LEGACY+':plan')||{});
      foodPrefs=Object.keys(foodPrefs).length?foodPrefs:(await sget(LEGACY+':foodprefs')||{});
      await saveRecipeStores(); await saveFridge(); await saveGrocery(); await savePlan(); await savePrefs();
    }
  }
  /* Only write when something actually changed. This used to fire on every page
     load, sending an identical row to the database each time the app opened. */
  if(!meta || meta.version!==APP_VERSION || !meta.seen)
    await sset(S.meta,{version:APP_VERSION,seen:(meta&&meta.seen)||new Date().toISOString()});

  /* Self-heal: an earlier build could save a *guessed* icon into a recipe's
     override (e.g. Mayak Eggs -> icedcoffee). If a stored icon is exactly what
     the guesser would pick, or points at an icon that no longer exists, drop it
     so the icon shipped with the recipe shows through. Custom picks are kept. */
  let healed=false;
  seed().forEach(s=>{
    const o=overrides[s.id];
    if(o && o.icon && !o.img && o.icon!==s.icon && (o.icon===guessIcon(s) || !ART[o.icon])){
      delete o.icon;
      if(Object.keys(o).length===0) delete overrides[s.id];
      healed=true;
    }
  });
  if(healed) await saveRecipeStores();

  /* Same heal for recipes you wrote yourself: an icon name that is no longer in
     ART gets re-guessed. This used to run over `recipes`, which rebuild() below
     replaces wholesale a few lines later — so it healed a throwaway copy and
     nothing was ever saved. `mine` is the stored array, so this one sticks. */
  let mineFixed=false;
  mine.forEach(r=>{ if(!r.img && r.icon && !ART[r.icon]){ r.icon=guessIcon(r); mineFixed=true; } });
  if(mineFixed) await sset(S.mine,mine);

  let dirty=false;
  fridge.forEach(f=>{ if(!f.addedAt){ f.addedAt=todayISO(); dirty=true; } });
  if(dirty) await saveFridge();

  /* To-dos saved before they had stable ids — give them one so the row handlers
     can stop keying off array position. */
  let todosFixed=false;
  todos.forEach(t=>{ if(!t.id){ t.id=todoId(); todosFixed=true; } });
  if(todosFixed) await saveTodos();

  /* Merge the saved data in and repaint. Keep the user's place if they've
     already tapped into something during the brief load. */
  rebuild();
  if(SHARE){
    if(SHARE_ID && find(SHARE_ID)) currentId=SHARE_ID;
  } else {
    if(!userNavigated) applyHash();   /* user recipes now exist, so a deep link to one resolves */
    if((currentId==null||(mode==='recipe'&&!find(currentId)))) { currentId=recipes[0]?.id??null; if(mode==='recipe'&&!currentId) mode='home'; }
  }
  booting=false;                      /* hydration done — the URL may track state again */
  render();
 }catch(e){
  /* whatever went wrong, still show the app rather than a blank page */
  booting=false;
  try{ rebuild(); currentId=recipes[0]?.id??null;
  mode='home'; render(); }catch(_){}
  banner('Something went wrong starting up: '+(e&&e.message||e)+'. Your data is safe; try reloading.');
  console.error(e);
 }
})();

</script>
</body>
</html>
